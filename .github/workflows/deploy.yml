name: Deploy Wolof PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct and verify PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = [Path(f".deploy/wolof-app.part0{i}").read_text(encoding="ascii").strip() for i in range(6)]
          raw = base64.b64decode("".join(parts), validate=True)
          expected = "65c55dc8383fc4b76b07ccd449709d3094e87988340017261b2381e88aee0ea1"
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f"SHA256 mismatch: {actual}")
          Path("/tmp/wolof-app.zip").write_bytes(raw)
          PY
          rm -rf site
          mkdir site
          unzip -tq /tmp/wolof-app.zip
          unzip -q /tmp/wolof-app.zip -d site
          test -f site/index.html
          test -f site/service-worker.js
          test -f site/manifest.webmanifest

      - name: Make PWA updates cache-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("site/index.html")
          s=p.read_text()
          s=s.replace('href="styles.css"','href="styles.css?v=22"')
          s=s.replace('<script src="data.js"></script><script src="app.js"></script>','<script src="data.js?v=22"></script><script src="app.js?v=22"></script>')
          s=s.replace('CORPUS V2</em>','CORPUS V2.2</em>')
          p.write_text(s)

          p=Path("site/app.js")
          s=p.read_text()
          old="if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js').catch(()=>{});"
          new="""if('serviceWorker' in navigator && location.protocol!=='file:'){
            navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
          }"""
          if old in s:
              s=s.replace(old,new)
          p.write_text(s)
          PY
          cat > site/service-worker.js <<'EOF'
          const CACHE='njang-wolof-v2-mobile-20261004-updatefix';
          const ASSETS=['./','./index.html','./styles.css?v=22','./data.js?v=22','./app.js?v=22','./manifest.webmanifest','./icon.svg','./icon-180.png','./icon-192.png','./icon-512.png'];
          self.addEventListener('install',event=>event.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(ASSETS)).then(()=>self.skipWaiting())));
          self.addEventListener('activate',event=>event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))).then(()=>self.clients.claim())));
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            const url=new URL(event.request.url);
            if(url.origin!==self.location.origin) return;
            event.respondWith(fetch(event.request,{cache:'no-store'}).then(response=>{
              if(response&&response.ok){
                const copy=response.clone();
                caches.open(CACHE).then(cache=>cache.put(event.request,copy));
              }
              return response;
            }).catch(()=>caches.match(event.request).then(hit=>hit||caches.match('./index.html'))));
          });
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
