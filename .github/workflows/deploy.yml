name: Deploy Wolof PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate learning and legacy progress
        run: |
          python3 validate-corpus.py --check
          node --test tests/*.test.cjs
          for file in site/*.js; do node --check "$file"; done
          python3 - <<'CHECK'
          from pathlib import Path
          import json
          site = Path('site')
          manifest = json.loads((site/'manifest.webmanifest').read_text())
          assert manifest['display'] == 'standalone'
          assert "KEY='njang-wolof-v2'" in (site/'app.js').read_text()
          for asset in ('styles.css', 'data.js', 'lexicon-packs.js', 'learning.js', 'app.js'):
              assert (site/asset).is_file()
              assert asset+'?v=40' in (site/'index.html').read_text()
              assert asset+'?v=40' in (site/'service-worker.js').read_text()
          data_text = (site/'data.js').read_text()
          data = json.loads(data_text[data_text.index('{'):data_text.rindex('}')+1])
          for asset in data['lexiconFiles']:
              assert (site/asset).is_file()
              assert asset+'?v=40' in (site/'index.html').read_text()
              assert asset+'?v=40' in (site/'service-worker.js').read_text()
          for icon in manifest['icons']:
              assert (site/icon['src']).is_file()
          CHECK
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
